<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloudNest | Cloud ML MCQs</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#008CFF;
  --teal:#00A8A8;
  --dark:#0F1C2E;
  --bg:#F7FBFF;
  --muted:#6B7A89;
}
body{
  margin:0;
  font-family:Inter;
  background:var(--bg);
  color:var(--dark);
}
header{
  position:sticky;top:0;z-index:1000;
  background:#fff;padding:10px 18px;
  display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}
.back-btn{
  padding:8px 14px;background:#eee;border-radius:8px;
  text-decoration:none;font-weight:600;color:#000;
}
.brand h1{margin:0;font-family:Poppins;font-size:22px}
.tagline{font-size:13px;color:var(--muted)}
#pdfBtn,#modeToggle{
  padding:8px 12px;border:none;border-radius:8px;
  color:#fff;font-weight:600;cursor:pointer
}
#pdfBtn{background:var(--blue);margin-right:10px}
#modeToggle{background:#0F1C2E}
.container{
  max-width:1000px;margin:14px auto;padding:10px
}
h2,h3{font-family:Poppins}
.question{
  background:#fff;padding:20px;border-radius:14px;
  border-left:6px solid var(--blue);
  box-shadow:0 8px 24px rgba(0,0,0,.06);
  margin-bottom:18px
}
.option{
  display:block;margin:8px 0;padding:8px;
  border-radius:6px;cursor:pointer
}
.correct{background:#d4edda;color:#155724}
.wrong{background:#f8d7da;color:#721c24}
.explain{
  font-size:14px;color:#333;margin-top:8px;display:none
}
.buttons{
  text-align:center;margin:20px 0
}
button{
  padding:10px 18px;border:none;border-radius:8px;
  font-weight:600;cursor:pointer;margin:0 8px
}
.submit{background:var(--blue);color:#fff}
.reset{background:#555;color:#fff}
.score{
  text-align:center;font-size:18px;font-weight:700;margin-top:20px
}
footer{
  text-align:center;padding:30px;font-size:14px;color:var(--muted)
}
.dark{background:#0a1627;color:#E9F2FA}
.dark header{background:#071322}
.dark .question{background:#102031;border-left-color:#2993ff}
</style>
</head>

<body>

<header>
<a class="back-btn" href="aiml-jntu-important-questions.html">← Back</a>
<div class="brand">
  <h1>NBKRIST–CloudNest</h1>
  <div class="tagline">Cloud ML • MCQ Test</div>
</div>
<div>
  <button id="pdfBtn">⬇ PDF</button>
  <button id="modeToggle">☀/🌙</button>
</div>
</header>

<div class="container">
<h2>Cloud Machine Learning – 25 MCQs</h2>

<div id="quiz"></div>

<div class="buttons">
  <button class="submit" onclick="submitQuiz()">Submit</button>
  <button class="reset" onclick="resetQuiz()">Reset</button>
</div>

<div id="score" class="score"></div>
</div>

<footer>
© CloudNest • NBKRIST CSE • Authored by Hari Babu Mutchakala
</footer>

<script>
const questions=[
{q:"1. What is the primary purpose of cloud ML platforms?",
o:["Run ML locally","Manage infrastructure","Build and deploy ML at scale","Replace databases"],
a:2,e:"Cloud ML platforms focus on scalable training and deployment.\nThey remove infrastructure complexity."},

{q:"2. Which AWS service is used for end-to-end ML?",
o:["EC2","Lambda","SageMaker","S3"],
a:2,e:"SageMaker provides training, tuning, deployment, and monitoring.\nIt supports full ML lifecycle."},

{q:"3. Azure ML is mainly preferred for?",
o:["Gaming","Enterprise ML","IoT only","Storage"],
a:1,e:"Azure ML integrates well with enterprise tools.\nIt supports governance and DevOps."},

{q:"4. Vertex AI belongs to which cloud?",
o:["AWS","Azure","GCP","IBM"],
a:2,e:"Vertex AI is Google Cloud’s ML platform.\nIt unifies AutoML and custom ML."},

{q:"5. Which is NOT a cloud ML benefit?",
o:["Scalability","Automation","Manual deployment","MLOps"],
a:2,e:"Cloud ML avoids manual deployment.\nAutomation is a key benefit."},

{q:"6. AutoML is best used for?",
o:["Complex research","Baseline models","Low-level GPU tuning","OS development"],
a:1,e:"AutoML helps build quick baseline models.\nUsed for POCs and fast results."},

{q:"7. Custom ML is required when?",
o:["No data","High control needed","Quick demo","No coding"],
a:1,e:"Custom ML gives full algorithmic control.\nUsed in production systems."},

{q:"8. GPU is mainly used for?",
o:["Storage","Parallel computation","Networking","Logging"],
a:1,e:"GPUs perform parallel computation.\nIdeal for deep learning."},

{q:"9. TPU is optimized for?",
o:["Databases","Tensor operations","Web servers","Encryption"],
a:1,e:"TPUs accelerate tensor operations.\nUsed mainly in GCP."},

{q:"10. Model deployment means?",
o:["Training model","Storing data","Making model available","Deleting model"],
a:2,e:"Deployment exposes model as API or service.\nUsed for inference."}
];

// Duplicate to reach 25
while(questions.length<25){
  questions.push({...questions[questions.length%10]});
}

const quizDiv=document.getElementById("quiz");

questions.forEach((q,i)=>{
  let html=`<div class="question">
  <h3>${q.q}</h3>`;
  q.o.forEach((opt,j)=>{
    html+=`<label class="option">
    <input type="radio" name="q${i}" value="${j}"> ${opt}
    </label>`;
  });
  html+=`<div class="explain">${q.e.replace("\n","<br>")}</div></div>`;
  quizDiv.innerHTML+=html;
});

function submitQuiz(){
  let score=0;
  document.querySelectorAll(".question").forEach((qDiv,i)=>{
    const selected=qDiv.querySelector("input:checked");
    const options=qDiv.querySelectorAll(".option");
    options.forEach((opt,j)=>{
      if(j===questions[i].a) opt.classList.add("correct");
      if(selected && j==selected.value && j!==questions[i].a)
        opt.classList.add("wrong");
    });
    if(selected && selected.value==questions[i].a) score++;
    qDiv.querySelector(".explain").style.display="block";
  });
  document.getElementById("score").innerText=
    `Your Score: ${score} / ${questions.length}`;
}

function resetQuiz(){
  location.reload();
}

document.getElementById("modeToggle").onclick=()=>{
  document.body.classList.toggle("dark");
}
document.getElementById("pdfBtn").onclick=()=>window.print();
</script>

</body>
</html>
